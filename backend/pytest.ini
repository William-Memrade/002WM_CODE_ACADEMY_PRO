[pytest]
testpaths = tests
norecursedirs = pytest-cache-files-* .pytest_cache venv .venv __pycache__

addopts = -p no:cacheprovider

# Los tests async se detectan solos (no hace falta @pytest.mark.asyncio, aunque
# dejarlo puesto no molesta).
asyncio_mode = auto
# Cada test (y sus fixtures) corre en su propio event loop. Sin esto, un engine de
# SQLAlchemy creado a nivel de módulo queda atado al loop del primer test y el
# segundo falla con "got Future attached to a different loop".
asyncio_default_fixture_loop_scope = function

markers =
    integration: necesita PostgreSQL y Redis levantados (tests/support.py); se salta si faltan
    slow: tarda más de unos segundos
