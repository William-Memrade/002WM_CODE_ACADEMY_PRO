# ============================================================================
# CodeAcademy Pro — Dev Services Only (Hybrid Mode)
# Solo infraestructura: PostgreSQL, Redis, Mailhog
# Backend y Frontend se ejecutan directamente en WSL
# ============================================================================

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: academy-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: academy_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: academy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Mailhog (Email testing) ──────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: academy-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
